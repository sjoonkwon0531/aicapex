<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 투자·메모리 동향 기록</title>
<meta name="description" content="빅테크 AI 설비투자와 한국 메모리 공급망에 관한 새 공시·통계·발표를 날짜순으로 기록합니다. 권석준(성균관대학교).">
<meta name="author" content="권석준"><meta property="og:title" content="AI 투자·메모리 동향 기록"><meta property="og:url" content="https://aicapex.sjoonkwon.com/watch"><link rel="canonical" href="https://aicapex.sjoonkwon.com/watch">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a dated log in one reading column, newest first; each entry names the sites it touches and its sources. */
:root {
  color-scheme: light;
  --bg: #f5f6f4; --panel: #ffffff; --ink: #15191c; --ink-2: #4a5157; --ink-3: #6f777d; --rule: #dde1dd;
  --accent: #1f5d73; --accent-soft: #e2eef1; --warn: #8a5300; --warn-soft: #f8efdf;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark; --bg: #121618; --panel: #1a1f22; --ink: #e8ecec; --ink-2: #b2babd; --ink-3: #8b9498; --rule: #2c3337;
  --accent: #7cc0d6; --accent-soft: #1d3138; --warn: #e2b46a; --warn-soft: #2e2618; } }
:root[data-theme="dark"] {
  color-scheme: dark; --bg: #121618; --panel: #1a1f22; --ink: #e8ecec; --ink-2: #b2babd; --ink-3: #8b9498; --rule: #2c3337;
  --accent: #7cc0d6; --accent-soft: #1d3138; --warn: #e2b46a; --warn-soft: #2e2618; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--sans); }
.hub-back { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--accent-soft); border-bottom: 1px solid var(--rule); padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 13px; font-weight: 500; }
.hub-back a { color: var(--accent); text-decoration: none; } .hub-back a:hover { text-decoration: underline; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 36px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
h1 { font-size: clamp(24px, 4vw, 32px); line-height: 1.3; margin: 0; text-wrap: balance; }
.lead { margin: 8px 0 0; color: var(--ink-2); max-width: 62ch; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--rule); }
.e { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 4px 20px; padding-block: 20px; border-bottom: 1px solid var(--rule); }
.e time { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); padding-top: 3px; font-variant-numeric: tabular-nums; }
.e h2 { margin: 0; font-size: 17px; line-height: 1.4; text-wrap: balance; }
.e p { margin: 6px 0 0; color: var(--ink-2); max-width: 64ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { font-family: var(--mono); font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); text-decoration: none; }
.tag.dec { background: var(--warn-soft); color: var(--warn); }
.src { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; }
.src a { color: var(--accent); }
.note { font-size: 13px; color: var(--ink-3); margin: 0; max-width: 64ch; }
@media (max-width: 560px) { .e { grid-template-columns: minmax(0, 1fr); } }
</style>
</head><body>
<nav class="hub-back" aria-label="사이트 목록"><a href="/">← 빅테크 AI 투자 시뮬레이터 · 권석준</a><span><a href="/capex">설비투자 추적</a> · <a href="https://memsim.sjoonkwon.com">메모리 국면</a> · <a href="https://sjoonkwon.com">홈</a></span></nav>
<main class="wrap">
  <header>
    <h1>AI 투자·메모리 동향 기록</h1>
    <p class="lead">빅테크 AI 설비투자와 한국 메모리 공급망에 관한 새 공시·통계·발표 가운데, 이 사이트의 모형과 그림에 영향을 주는 것만 날짜순으로 적습니다. 항목마다 원자료 링크를 붙입니다.</p>
  </header>
  <ol class="log" id="log"><li class="e"><time>—</time><div><h2>기록을 불러오는 중입니다.</h2></div></li></ol>
  <p class="note" id="upd"></p>
  <p class="note">기록은 Claude가 공개 자료를 정기적으로 확인해 정리하고, 모형의 가정이나 해석을 바꾸는 항목은 권석준이 검토한 뒤 반영합니다. 투자 권유가 아닙니다.</p>
</main>
<script>
(function () {
  const SITE = { capex: ['설비투자 추적', '/capex'], hyperscaler: ['주가·조달', '/hyperscaler'], google: ['구글 전략', '/google'], commerce: ['에이전트 커머스', '/commerce'], memsim: ['메모리 국면', 'https://memsim.sjoonkwon.com'], monitor: ['메가프로젝트', 'https://monitor.sjoonkwon.com'], brief: ['브리프', null] };
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  fetch('/watch/entries.json', { cache: 'no-store' }).then((r) => r.json()).then((d) => {
    const log = document.getElementById('log'); log.replaceChildren();
    const es = [...d.entries].sort((a, b) => (a.date < b.date ? 1 : -1));
    for (const x of es) {
      const li = el('li', 'e'); const tm = el('time', null, x.date); tm.dateTime = x.date;
      const box = el('div'); box.append(el('h2', null, x.title), el('p', null, x.body));
      const tags = el('div', 'tags');
      for (const s of x.sites || []) { const m = SITE[s]; if (!m) continue; const a = el(m[1] ? 'a' : 'span', 'tag', m[0]); if (m[1]) a.href = m[1]; tags.append(a); }
      if (x.decision) tags.append(el('span', 'tag dec', '검토 중'));
      box.append(tags);
      if (x.sources && x.sources.length) { const ul = el('ul', 'src'); for (const s of x.sources) { const l = el('li'); const a = el('a', null, s.title); a.href = s.url; a.rel = 'noopener'; a.target = '_blank'; l.append('출처: ', a); ul.append(l); } box.append(ul); }
      li.append(tm, box); log.append(li);
    }
    document.getElementById('upd').textContent = '마지막 확인: ' + d.updated;
  }).catch(() => { document.getElementById('log').replaceChildren(el('li', 'e', '기록을 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.')); });
})();
</script>
</body></html>
